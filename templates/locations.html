<section id="locations" data-map="{{ view.map.code }}" data-mode="{{ view.mode }}" data-point="{{ view.selected }}" hx-get="/locations" data-state='{"map":"{{ view.map.code }}","mode":"{{ view.mode }}","point":"{{ view.selected }}","revision":"{{ view.revision }}"}' hx-trigger="every 1s, locationsChanged from:body" hx-swap="outerHTML">
<header class="toolbar">
<form method="get" action="/" hx-get="/locations" hx-target="#locations" hx-swap="outerHTML">
<input type="hidden" name="mode" value="{{ view.mode }}">
<select name="map" aria-label="Map" data-map-select {% if view.detected == view.map.code %}data-map-detected aria-describedby="map-detected-status" {% endif %}{% if !view.detected.is_empty() %}disabled{% endif %}>
{% for map in view.maps %}<option value="{{ map.code }}" {% if map.code == view.map.code %}selected{% endif %}>{{ map.name }}</option>{% endfor %}
</select>
{% if view.detected == view.map.code %}<span id="map-detected-status" class="sr-only">Map detected in CS2</span>{% endif %}
<noscript><button>Open</button></noscript>
</form>
<div class="toolbar-actions">
<button type="button" data-editor="spot"{% if view.mode == "captures" %} disabled{% endif %}>Add spot</button>
<form method="get" action="/" hx-get="/locations" hx-target="#locations" hx-swap="outerHTML">
<input type="hidden" name="map" value="{{ view.map.code }}">
<select name="mode" aria-label="Mode" data-mode-select><option value="spots" {% if view.mode == "spots" %}selected{% endif %}>Mode: Saved</option><option value="captures" {% if view.mode == "captures" %}selected{% endif %}>Mode: Captures</option></select>
<noscript><button>Open</button></noscript>
</form>
</div>
<div class="toolbar-settings">
<select aria-label="Theme" data-theme-select><option value="light">Light</option><option value="dark">Dark</option></select>
</div>
</header>
<div class="workspace">
<nav aria-label="Spots">
<div class="location-list" data-spot-list>
{% for point in view.points %}
<button type="button" id="point-{{ point.key }}" data-point="{{ point.key }}" data-position="{{ point.command }}" title="{{ point.name }}" class="spot{% if point.selected %} selected{% endif %}"><span hx-disable>{{ point.name }}</span></button>
{% endfor %}
</div>
</nav>
<div class="map">
{% if view.map.artwork.is_some() %}
<svg viewBox="{{ view.map.viewport }}" aria-label="{{ view.map.name }} starting positions" aria-describedby="map-navigation-help" role="group" tabindex="0" data-map-viewport>
<image class="map-light" href="/assets/maps/{{ view.map.code.trim_start_matches("de_") }}.svg" width="1024" height="1024" />
<image class="map-dark" href="/assets/maps/{{ view.map.code.trim_start_matches("de_") }}-dark.svg" width="1024" height="1024" />
{% for point in view.points %}{% if point.placed %}<g role="button" tabindex="0" data-point="{{ point.key }}" aria-label="Select {{ point.name }}" class="dot{% if point.selected %} selected{% endif %}" transform="translate({{ point.x }} {{ point.y }})"><title>{{ point.name }}</title><g class="dot-symbol"><circle class="dot-hit" r="11"/><circle class="dot-core" r="5"/></g></g>{% endif %}{% endfor %}
</svg>
<a class="map-credit" href="https://setpos.gg" target="_blank" rel="noreferrer">Maps: setpos.gg</a>
<span id="map-navigation-help" class="sr-only">Scroll to zoom, drag to pan. With the map focused, use + or − to zoom, arrow keys to pan, and 0 to fit.</span>
{% endif %}
</div>
</div>
<footer>
<div class="app-brand"><img src="/assets/logo.svg" width="24" height="24" alt=""><span>Utilizer</span><button type="button" data-editor="binds" aria-label="Binds"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .5c0 1.5-2.5 2-2.5 3.5"/><path d="M12 17h.01"/></svg></button></div>
<div class="map-controls" role="group" aria-label="Map zoom">
<button type="button" data-map-zoom="out" aria-label="Zoom out">−</button>
<button type="button" data-map-zoom="in" aria-label="Zoom in">+</button>
<button type="button" data-map-zoom="fit">Fit</button>
</div>
</footer>
</section>
