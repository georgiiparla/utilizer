{% extends "base.html" %}
{% block body %}
<main class="login-screen">
  <header class="login-brand"><img src="/assets/logo.svg" width="32" height="32" alt=""><h1>Utilizer</h1></header>
  <form method="post" action="/login">
    <input id="code" name="code" aria-label="Code" placeholder="Code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" autofocus required>
  </form>
</main>
{% endblock %}

{% block notification %}{% if !error.is_empty() %}<p data-important>{{ error }}</p>{% endif %}{% endblock %}
