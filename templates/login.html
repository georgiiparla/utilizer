{% extends "base.html" %}
{% block body %}
<main class="login">
  <h1 class="brand">{% include "brand.html" %}</h1>
  <form method="post" action="/login">
    <label for="code">Code from the terminal</label>
    <input id="code" name="code" class="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" autofocus required>
    {% if !error.is_empty() %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    <button class="primary wide" type="submit">Unlock</button>
  </form>
</main>
{% endblock %}
