<section id="captures" class="capture-inbox" hx-get="/captures?playlist={{ playlist_id }}" hx-trigger="every 2s" hx-swap="outerHTML" aria-label="Captured positions">
  <div class="section-label"><h3>Capture inbox</h3><span>{{ captures.len() }} pending</span></div>
  {% if captures.is_empty() %}
  <p class="fine">Press <kbd>F6</kbd> in practice to capture your position.</p>
  {% else %}
  <div class="capture-links">
  {% for capture in captures %}
    <a href="/?playlist={{ playlist_id }}&amp;capture={{ capture.id }}" hx-get="/?playlist={{ playlist_id }}&amp;capture={{ capture.id }}" hx-target="#workspace" hx-swap="outerHTML">Capture #{{ capture.id }} <span>Review ↗</span></a>
  {% endfor %}
  </div>
  {% endif %}
</section>
{% if polled %}<span id="reader-status" class="reader" role="status" hx-swap-oob="outerHTML"><i></i>{{ status }}</span>{% endif %}
