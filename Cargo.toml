[package]
name = "utilizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local CS2 capture and training-config core"
license = "MIT"

[dependencies]
notify = "8.2"
rusqlite = { version = "0.40", features = ["bundled"] }
same-file = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
lto = "thin"
strip = true
