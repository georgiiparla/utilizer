name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Check and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the project Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Check release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Cargo metadata' }
          $version = ($metadata.packages | Where-Object name -eq 'utilizer').version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Release tag must be v$version" }

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test the core and native filesystem callbacks
        run: cargo test --locked

      - name: Build the optimized Windows executable
        run: cargo build --locked --release

      - name: Verify executable and installer syntax
        run: |
          & target/x86_64-pc-windows-msvc/release/utilizer.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Executable could not start' }
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @('install.ps1', 'uninstall.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }

      - name: Test install, update, uninstall and purge in Windows PowerShell 5.1
        run: powershell.exe -NoProfile -File tests/installer.ps1 -Executable target/x86_64-pc-windows-msvc/release/utilizer.exe

      - name: Prepare executable and checksum
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/utilizer.exe -Destination dist/utilizer-windows-x86_64.exe
          $hash = (Get-FileHash -LiteralPath dist/utilizer-windows-x86_64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  utilizer-windows-x86_64.exe`n" | Set-Content -LiteralPath dist/SHA256SUMS -Encoding ascii -NoNewline
          Copy-Item -LiteralPath install.ps1 -Destination dist/install.ps1
          Copy-Item -LiteralPath uninstall.ps1 -Destination dist/uninstall.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: utilizer-windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Prepare versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the checked Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: utilizer-windows-x86_64
          path: dist
      - name: Verify checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Prepare draft with executable and installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/utilizer-windows-x86_64.exe dist/SHA256SUMS dist/install.ps1 dist/uninstall.ps1
          --verify-tag --draft --title "Utilizer $RELEASE_TAG" --generate-notes
