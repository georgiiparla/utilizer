name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the project Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test the core and native filesystem callbacks
        run: cargo test --locked

      - name: Build the optimized Windows executable
        run: cargo build --locked --release

      - name: Prepare executable and checksum
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath target/x86_64-pc-windows-msvc/release/utilizer.exe -Destination dist/utilizer-windows-x86_64.exe
          $hash = (Get-FileHash -LiteralPath dist/utilizer-windows-x86_64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  utilizer-windows-x86_64.exe" | Set-Content -LiteralPath dist/SHA256SUMS -Encoding ascii

      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: utilizer-windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
